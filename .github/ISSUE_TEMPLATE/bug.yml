name: Fehler / Bug
description: Etwas funktioniert nicht oder liefert ein falsches Ergebnis. / Something does not work or gives a wrong result.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Ausgabe von `freemapper-courseplan --version`. / Output of `freemapper-courseplan --version`.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Karte / Map
      description: Welche Karte (Sprint, Schulhof, Wald) und welcher Maßstab? / Which map (sprint, schoolyard, forest) and which scale?
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert? / What happened?
      description: Befehl, Meldung (`error:` / `Fehler:`) und was du erwartet hast. / The command, the message and what you expected.
    validations:
      required: true
