[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-courseplan"
rust-version = "1.88"

[workspace.dependencies]
freemapper-courseplan-model = { path = "crates/freemapper-courseplan-model" }
freemapper-courseplan = { path = "crates/freemapper-courseplan" }
freemapper-text = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
freemapper-rules = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
freemapper-omap = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
freemapper-course = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
freemapper-render = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
# The self-update: manifest, signature check, version order and the swap; no network (ADR 0076).
freemapper-update = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
freemapper-printrules = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
# The suite contract: the shared types (map kind, sidecar reader, object class) without the checker; the
# tests add its fixtures (ADR 0041, core ADR 0027).
freemapper-contract = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
toml_edit = { version = "=0.25.17", features = ["serde"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
# Pinned: newer releases are younger than two weeks (ADR 0006). Build with --locked.
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std", "net", "time", "signal", "sync"] }
# The editor server (ADR 0042). The versions are those of freemapper-core's freemapper-web.
freemapper-web = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.19.0" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
rust-embed = { version = "8.13.0", features = ["debug-embed", "mime-guess"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# The HTTP client of the self-update. Pinned: newer releases are younger than two weeks (ADR 0006).
ureq = "=3.4.2"
# Tests only: the key parser of freemapper-update, to check the committed public keys; same pin as in
# freemapper-core.
minisign-verify = "=0.3.0"
# The oldest version whose updater may install the next release (ADR 0076). Left unset, the first release
# with the updater takes its own version and later ones carry the value over from the previous signed
# manifest (.github/scripts/update-manifest.sh). Set it by hand only when a release changes the update path:
#
# [workspace.metadata.update]
# min_self_update_from = "0.14.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The route search of the score tools is slow unoptimised (a draft on the synthetic test map took a minute
# in a debug build), so the domain crate is optimised in dev and test builds (ADR 0068).
[profile.dev.package.freemapper-courseplan]
opt-level = 2
