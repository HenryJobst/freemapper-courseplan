[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-courseplan"
rust-version = "1.88"

[workspace.dependencies]
freemapper-courseplan-model = { path = "crates/freemapper-courseplan-model" }
freemapper-courseplan = { path = "crates/freemapper-courseplan" }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
toml_edit = { version = "=0.25.17", features = ["serde"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
# Pinned: newer releases are younger than two weeks (ADR 0006). Build with --locked.
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
