# Rule profile: German competition rules for orienteering (WKB), 37th amendment, 1 March 2026.
# Format: ADR 0025 and rules/README.md. Document keys follow
# docs/research/2026-11-08-bahnlegung-kriterien.md, section 1.
#
# Value names carry their unit: metres, mm, degrees, percent, factor. Values without a unit are
# texts, lists of texts (symbol codes) or one of these documented tables (rules::TABLE_VALUES):
#
#   code_range     range       = [min, max]                 lowest and highest code, both included
#   code_pairs     pairs       = [[a, b], ...]              codes that must not both be used
#   length_table   courses     = [{ course, printed, categories, he_length_percent = [min, max] }, ...]
#                                one row per course of WKB Anlage 5; "printed" is the row's category
#                                cell as the PDF prints it, "categories" the same as rule categories
#   difficulty_mix levels      = { category = level, ... }  technical difficulty 1 to 5
#                  easy_levels = [level, ...]               never on one course with hard_levels
#                  hard_levels = [level, ...]
#
# Rule categories are written without spaces, a trailing "-" of an age class is dropped, and a
# "D/H" cell becomes one D and one H category: "D -20" -> "D-20", "H 35-" -> "H35",
# "D 19- A" -> "D19A", "H 21- A" -> "H21A", "D/H -12b" -> "D-12b", "H-12b". "Dir.." direct
# courses keep their names.

format = 1

