# ---------------------------------------------------------------------------------------------
# Distances between controls (plan M2b, Task 4). WKB26 B 7.2.1 sets 30 m and 60 m and halves
# them at map scale 1:3000 or 1:4000 (ruling R4: the filter is the print scale). The similar
# features rules also filter by map kind, because the symbol codes differ between ISOM (forest)
# and ISSprOM (sprint, schoolyard).

[[rules]]
id = "wkb2026.distance.min"
key = "min_distance"
severity = "error"
print_scales = [5000, 7500, 10000, 15000]
values = { metres = 30.0 }
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "Die Startflagge zählt als Posten (Lesart wie IOF-R 19.4).", en = "The start flag counts as a control (read as in IOF-R 19.4)." }

[[rules]]
id = "wkb2026.distance.min_half"
key = "min_distance"
severity = "error"
print_scales = [1000, 2000, 3000, 4000]
values = { metres = 15.0 }
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "WKB26 B 7.2.1: bei 1:3.000/1:4.000 die Hälfte. Dass das auch für 1:1.000 und 1:2.000 (Schulhofkarten) gilt, ist ein Vorschlag (Claude's call, Plan M2b). Die Startflagge zählt als Posten (Lesart wie IOF-R 19.4).", en = "WKB26 B 7.2.1: half at 1:3,000/1:4,000. Applying this to 1:1,000 and 1:2,000 (schoolyard maps) as well is a proposal (Claude's call, plan M2b). The start flag counts as a control (read as in IOF-R 19.4)." }

[[rules]]
id = "wkb2026.distance.similar"
key = "similar_features"
severity = "warning"
map_kinds = ["forest"]
print_scales = [5000, 7500, 10000, 15000]
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "Ähnliche Objekte nach BOF B6.1.3 bis B6.1.4, als ISOM-2017-2-Symbole: Bach, Graben und schmaler Sumpf; Senke und Loch; Kuppen; Zaun und verfallener Zaun; Wege und Schneisen. Gleiche Punktsymbole sind immer ähnlich, gleiche Linien und Flächen nur über ihre Gruppe. Sporn und Rinne haben kein eigenes Symbol und fehlen.", en = "Similar features after BOF B6.1.3 to B6.1.4, as ISOM 2017-2 symbols: stream, ditch and narrow marsh; depression and pit; knolls; fence and ruined fence; paths and rides. Identical point symbols are always similar; identical lines and areas only through their group. Spur and re-entrant have no symbol of their own and are left out." }

[rules.values]
metres = 60.0
# The control feature is the map feature nearest to the control centre within this distance
# (plan M2b, Task 4).
feature_search_mm = 1.0
# ISOM 2017-2: 304 crossable watercourse, 305 small crossable watercourse, 306 minor/seasonal
# water channel, 309 narrow marsh | 111 small depression, 112 pit | 109 small knoll, 110 small
# elongated knoll | 516 fence, 517 ruined fence | 505 footpath, 506 small footpath, 507 less
# distinct small footpath, 508 narrow ride or linear trace.
groups = [
  ["304", "305", "306", "309"],
  ["111", "112"],
  ["109", "110"],
  ["516", "517"],
  ["505", "506", "507", "508"],
]

[[rules]]
id = "wkb2026.distance.similar_half"
key = "similar_features"
severity = "warning"
map_kinds = ["forest"]
print_scales = [1000, 2000, 3000, 4000]
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "WKB26 B 7.2.1: bei 1:3.000/1:4.000 die Hälfte. Dass das auch für 1:1.000 und 1:2.000 (Schulhofkarten) gilt, ist ein Vorschlag (Claude's call, Plan M2b). Ähnliche Objekte nach BOF B6.1.3 bis B6.1.4, als ISOM-2017-2-Symbole: Bach, Graben und schmaler Sumpf; Senke und Loch; Kuppen; Zaun und verfallener Zaun; Wege und Schneisen. Gleiche Punktsymbole sind immer ähnlich, gleiche Linien und Flächen nur über ihre Gruppe. Sporn und Rinne haben kein eigenes Symbol und fehlen.", en = "WKB26 B 7.2.1: half at 1:3,000/1:4,000. Applying this to 1:1,000 and 1:2,000 (schoolyard maps) as well is a proposal (Claude's call, plan M2b). Similar features after BOF B6.1.3 to B6.1.4, as ISOM 2017-2 symbols: stream, ditch and narrow marsh; depression and pit; knolls; fence and ruined fence; paths and rides. Identical point symbols are always similar; identical lines and areas only through their group. Spur and re-entrant have no symbol of their own and are left out." }

[rules.values]
metres = 30.0
# The control feature is the map feature nearest to the control centre within this distance
# (plan M2b, Task 4).
feature_search_mm = 1.0
groups = [
  ["304", "305", "306", "309"],
  ["111", "112"],
  ["109", "110"],
  ["516", "517"],
  ["505", "506", "507", "508"],
]

[[rules]]
id = "wkb2026.distance.similar_sprint"
key = "similar_features"
severity = "warning"
map_kinds = ["sprint", "schoolyard"]
print_scales = [1000, 2000, 3000, 4000]
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "WKB26 B 7.2.1: bei 1:3.000/1:4.000 die Hälfte. Dass das auch für 1:1.000 und 1:2.000 (Schulhofkarten) gilt, ist ein Vorschlag (Claude's call, Plan M2b). Ähnliche Objekte nach BOF B6.1.3 bis B6.1.4, als ISSprOM-2019-2-Symbole: Bach, Graben und schmaler Sumpf; Senke und Loch; Kuppen; passierbarer und unpassierbarer Zaun (ISSprOM kennt keinen verfallenen Zaun); Wege und Schneisen. Gleiche Punktsymbole sind immer ähnlich, gleiche Linien und Flächen nur über ihre Gruppe.", en = "WKB26 B 7.2.1: half at 1:3,000/1:4,000. Applying this to 1:1,000 and 1:2,000 (schoolyard maps) as well is a proposal (Claude's call, plan M2b). Similar features after BOF B6.1.3 to B6.1.4, as ISSprOM 2019-2 symbols: stream, ditch and narrow marsh; depression and pit; knolls; passable and uncrossable fence (ISSprOM has no ruined fence); paths and rides. Identical point symbols are always similar; identical lines and areas only through their group." }

[rules.values]
metres = 30.0
# The control feature is the map feature nearest to the control centre within this distance
# (plan M2b, Task 4).
feature_search_mm = 1.0
# ISSprOM 2019-2 (checked against tests/fixtures/maps/luebeck.omap): 305 small crossable
# watercourse, 306 minor/seasonal watercourse, 309 narrow marsh | 111 small depression, 112 pit
# or hole | 109 small knoll, 110 small elongated knoll | 516 passable fence or railing, 518
# uncrossable fence or railing | 505 unpaved footpath or track, 506 small unpaved footpath or
# track, 507 less distinct small path, 508 narrow ride.
groups = [
  ["305", "306", "309"],
  ["111", "112"],
  ["109", "110"],
  ["516", "518"],
  ["505", "506", "507", "508"],
]

[[rules]]
id = "wkb2026.distance.similar_sprint_full"
key = "similar_features"
severity = "warning"
map_kinds = ["sprint", "schoolyard"]
print_scales = [5000, 7500, 10000, 15000]
source = { doc = "WKB26", section = "B 7.2.1" }
note = { de = "Ähnliche Objekte nach BOF B6.1.3 bis B6.1.4, als ISSprOM-2019-2-Symbole: Bach, Graben und schmaler Sumpf; Senke und Loch; Kuppen; passierbarer und unpassierbarer Zaun (ISSprOM kennt keinen verfallenen Zaun); Wege und Schneisen. Gleiche Punktsymbole sind immer ähnlich, gleiche Linien und Flächen nur über ihre Gruppe.", en = "Similar features after BOF B6.1.3 to B6.1.4, as ISSprOM 2019-2 symbols: stream, ditch and narrow marsh; depression and pit; knolls; passable and uncrossable fence (ISSprOM has no ruined fence); paths and rides. Identical point symbols are always similar; identical lines and areas only through their group." }

[rules.values]
metres = 60.0
# The control feature is the map feature nearest to the control centre within this distance
# (plan M2b, Task 4).
feature_search_mm = 1.0
groups = [
  ["305", "306", "309"],
  ["111", "112"],
  ["109", "110"],
  ["516", "518"],
  ["505", "506", "507", "508"],
]

[[rules]]
id = "wkb2026.map.edge"
key = "map_edge"
severity = "warning"
values = { metres = 10.0 }
source = { doc = "claude", section = "M2b plan, Task 4" }
note = { de = "BL02 (S. 10) nennt Posten zu nah am Kartenrand als Fehler, aber ohne Zahl; die 10 m sind ein Vorschlag.", en = "BL02 (p. 10) lists controls too close to the map edge as a mistake but gives no number; the 10 m are a proposal." }

[[rules]]
id = "wkb2026.map.inside"
key = "inside_map"
severity = "error"
source = { doc = "BL02", section = "Mögliche Fehler bei der Bahnlegung (p. 10)" }
note = { de = "Start, Ziel, Posten und Querungsstellen müssen auf der kartierten Fläche liegen, nicht im weißen Teil neben dem Gelände (Nutzer, 2026-11-12). Die Forschungsdatei führt unter BL02 den Posten zu nah am Kartenrand und die Route außerhalb der Karte; ein Wortlaut zu Start und Ziel liegt uns nicht vor. Gemessen wird gegen die Kartenobjekte selbst, nicht gegen das Rechteck um sie (ADR 0084).", en = "Start, finish, controls and crossing points must lie on the mapped area, not in the blank part beside the terrain (user, 2026-11-12). The research file lists, under BL02, a control too close to the map edge and a route outside the map; we do not have wording on start and finish. The test is against the map objects themselves, not against the box around them (ADR 0084)." }

[rules.values]
# A position is inside when a map object lies within this distance (ground metres); open squares
# between buildings stay inside, the blank part beside a strip of terrain does not.
metres = 50.0
# An axis-aligned rectangle line that spans this percentage of the terrain extent in both directions is the
# sheet frame, not terrain.
frame_percent = 80.0
# Layout symbols that mappers lay over the whole print area: 601 north lines pattern, 602 registration
# mark. They are no terrain.
ignore_symbols = ["601", "602"]

[[rules]]
id = "wkb2026.map.margin"
key = "map_margin"
severity = "error"
source = { doc = "user", section = "request 2026-11-12, ADR 0087" }
note = { de = "Start, Ziel, Posten und Querungsstellen müssen mindestens map_margin_m (Standard 50 m, Ereignis-Einstellung der Score-Tabelle) vom Rand der kartierten Fläche entfernt sein; der Läufer muss immer auf kartiertem Gebiet laufen können (Nutzer, 2026-11-12). Der Rand ist dort, wo kein Kartenobjekt mehr innerhalb von 50 m liegt, dieselbe Grenze wie bei map.inside. Gemessen wird auf einem Raster der kartierten Fläche, auf etwa 2 m genau. Eine Stelle außerhalb der kartierten Fläche meldet map.inside, nicht diese Regel. map.edge misst weiter gegen das Rechteck um die Objekte.", en = "Start, finish, controls and crossing points must lie at least map_margin_m (default 50 m, an event setting in the score table) from the edge of the mapped area; the runner must always be able to run on mapped ground (user, 2026-11-12). The edge is where no map object lies within 50 m any more, the same limit as map.inside. The distance is measured on a raster of the mapped area, to about 2 m. A position outside the mapped area is reported by map.inside, not by this rule. map.edge still measures against the box around the objects." }

[[rules]]
id = "wkb2026.control.dead_end"
key = "control_dead_end"
severity = "warning"
map_kinds = ["sprint", "schoolyard"]
source = { doc = "user", section = "request 2026-11-12, ADR 0085" }
note = { de = "Empfehlung des Nutzers, keine WKB-Regel: Posten sollen nicht weit in einer Sackgasse stehen, denn dort gibt es keine Routenwahl und der Läufer läuft eine lange Strecke hinein und wieder heraus. Kurze Stücke in Innenhöfe sind in Ordnung. Die Grenze ist die Einstellung dead_end_max_m (Standard 60 m). Die Tiefe ist die Gehstrecke vom Posten bis dorthin, wo das Wegenetz wieder eine Wahl bietet (ADR 0085).", en = "A recommendation of the user, not a WKB rule: controls should not stand deep in a dead end, because the runner has no route choice there and runs one long leg in and out. Short stretches into courtyards are fine. The limit is the setting dead_end_max_m (default 60 m). The depth is the walk from the control to where the path network offers a choice again (ADR 0085)." }

[[rules]]
id = "wkb2026.course.start_finish_distance"
key = "start_finish_distance"
severity = "hint"
map_kinds = ["sprint", "schoolyard"]
source = { doc = "user", section = "request 2026-11-12, ADR 0086" }
note = { de = "Empfehlung des Nutzers aus der Praxis, keine WKB-Regel: Bei Sprints liegen Start und Ziel meist nah beieinander, alles andere ist für Veranstalter und Läufer unpraktisch. Die Grenze für die Luftlinie ist die Einstellung start_finish_max_m (Standard 400 m). Eine Bahn von Hand darf abweichen; erzeugte Bahnen halten die Grenze ein (ADR 0086).", en = "A recommendation of the user from practice, not a WKB rule: at sprint events start and finish usually lie close together, anything else is impractical for organisers and runners. The limit for the straight line is the setting start_finish_max_m (default 400 m). A course made by hand may deviate; generated courses keep the limit (ADR 0086)." }

[[rules]]
id = "wkb2026.leg.through_control"
key = "leg_through_control"
severity = "warning"
source = { doc = "BL02", section = "Mögliche Fehler bei der Bahnlegung (p. 10)" }
note = { de = "Abstand ist der Radius des Postenkreises im Bahnaufdruck.", en = "The distance is the radius of the control circle in the course overprint." }

[[rules]]
id = "wkb2026.leg.through_forbidden"
key = "leg_through_forbidden"
severity = "warning"
map_kinds = ["forest"]
source = { doc = "WKB26", section = "B 7.2.6" }
note = { de = "Geprüft wird die Laufroute, nicht die Luftlinie zwischen zwei Posten (WKB26 B 7.2.6: die optimale Laufroute führt nicht durch Sperrgebiete). Bis zur Routenanalyse bleibt die Regel ungeprüft und steht unter den nicht geprüften Regeln. Eine Luftlinie über Sperrflächen ist normal; WKB26 B 7.2.5 rechnet die Länge als Luftlinien plus vorgesehene Umwege um Sperrgebiete. Seit 2026-11-12 so, auf Wunsch des Nutzers (ADR 0080).", en = "The running route is checked, not the straight line between two controls (WKB26 B 7.2.6: the best running route does not lead through out-of-bounds areas). Until the route analysis exists the rule stays unchecked and appears among the rules that were not checked. A straight line over out-of-bounds areas is normal; WKB26 B 7.2.5 counts the length as straight lines plus the planned detours around out-of-bounds areas. This is so since 2026-11-12, at the user's request (ADR 0080)." }

[rules.values]
# Out-of-bounds symbols of ISOM 2017-2: 520 area that shall not be entered, 708 out-of-bounds
# boundary, 709 out-of-bounds area.
impassable = ["520", "708", "709"]

[[rules]]
id = "wkb2026.leg.through_forbidden_sprint"
key = "leg_through_forbidden"
severity = "warning"
map_kinds = ["sprint", "schoolyard"]
source = { doc = "WKB26", section = "B 7.2.6" }
note = { de = "Geprüft wird die Laufroute, nicht die Luftlinie zwischen zwei Posten (WKB26 B 7.2.6: die optimale Laufroute führt nicht durch Sperrgebiete). Bis zur Routenanalyse bleibt die Regel ungeprüft und steht unter den nicht geprüften Regeln. Eine Luftlinie über Sperrflächen ist normal; WKB26 B 7.2.5 rechnet die Länge als Luftlinien plus vorgesehene Umwege um Sperrgebiete. Seit 2026-11-12 so, auf Wunsch des Nutzers (ADR 0080).", en = "The running route is checked, not the straight line between two controls (WKB26 B 7.2.6: the best running route does not lead through out-of-bounds areas). Until the route analysis exists the rule stays unchecked and appears among the rules that were not checked. A straight line over out-of-bounds areas is normal; WKB26 B 7.2.5 counts the length as straight lines plus the planned detours around out-of-bounds areas. This is so since 2026-11-12, at the user's request (ADR 0080)." }

[rules.values]
# Out-of-bounds symbols of ISSprOM 2019-2: 520 area that shall not be entered, 708 out-of-bounds
# boundary, 709 out-of-bounds area, 714 temporary construction or closed area.
impassable = ["520", "708", "709", "714"]

[[rules]]
id = "wkb2026.control.in_forbidden"
key = "control_in_forbidden"
severity = "error"
map_kinds = ["forest"]
source = { doc = "WKB26", section = "A 2.2" }
note = { de = "Ein Posten darf nicht in einem Sperrgebiet stehen. Als Sperrgebiet gilt ein Sperrgebiet-Sonderobjekt der Bahn und jede Kartenfläche mit einem Sperrgebiet-Symbol. Die Forschungsdatei nennt WKB26 A 2.2 und IOF-R 17.2: Sperrgebiete und unpassierbare Signaturen sind verboten, nach einer Liste von ISOM- und ISSprOM-Nummern. Den Wortlaut kennen wir nicht. Geprüft wird der Posten, nicht die Strecke (ADR 0081). Die Grenzlinie 708 ist eine Linie und wird nicht geprüft. Ein Posten genau auf dem Rand einer Fläche steht darin.", en = "A control must not stand in an out-of-bounds area. That means an out-of-bounds special object of the course and any map area with an out-of-bounds symbol. The research file gives WKB26 A 2.2 and IOF-R 17.2: out-of-bounds areas and impassable symbols are forbidden, per a list of ISOM and ISSprOM numbers. We do not know the original wording. The control is tested, not the leg (ADR 0081). The boundary line 708 is a line and is not tested. A control exactly on the edge of an area stands in it." }

[rules.values]
# Area symbols of ISOM 2017-2: 520 area that shall not be entered, 709 out-of-bounds area.
area_symbols = ["520", "709"]

[[rules]]
id = "wkb2026.control.in_forbidden_sprint"
key = "control_in_forbidden"
severity = "error"
map_kinds = ["sprint", "schoolyard"]
source = { doc = "WKB26", section = "A 2.2" }
note = { de = "Ein Posten darf nicht in einem Sperrgebiet stehen. Als Sperrgebiet gilt ein Sperrgebiet-Sonderobjekt der Bahn und jede Kartenfläche mit einem Sperrgebiet-Symbol. Die Forschungsdatei nennt WKB26 A 2.2 und IOF-R 17.2: Sperrgebiete und unpassierbare Signaturen sind verboten, nach einer Liste von ISOM- und ISSprOM-Nummern. Den Wortlaut kennen wir nicht. Geprüft wird der Posten, nicht die Strecke (ADR 0081). Die Grenzlinie 708 ist eine Linie und wird nicht geprüft. Ein Posten genau auf dem Rand einer Fläche steht darin.", en = "A control must not stand in an out-of-bounds area. That means an out-of-bounds special object of the course and any map area with an out-of-bounds symbol. The research file gives WKB26 A 2.2 and IOF-R 17.2: out-of-bounds areas and impassable symbols are forbidden, per a list of ISOM and ISSprOM numbers. We do not know the original wording. The control is tested, not the leg (ADR 0081). The boundary line 708 is a line and is not tested. A control exactly on the edge of an area stands in it." }

[rules.values]
# Area symbols of ISSprOM 2019-2: 520 area that shall not be entered, 709 out-of-bounds area,
# 714 temporary construction or closed area.
area_symbols = ["520", "709", "714"]

# ---------------------------------------------------------------------------------------------
# Leg shapes (plan M2b, Task 5)

[[rules]]
id = "wkb2026.leg.acute_angle"
key = "acute_angle"
severity = "warning"
values = { degrees = 45.0 }
source = { doc = "claude", section = "M2b plan, Task 5" }
note = { de = "Spitze Winkel lassen Läufer auf dem Hinweg den Abgehenden begegnen (BL12 Abschnitt 5; SOA: Hundeknochen). Die 45° sind ein Vorschlag.", en = "Acute angles make runners meet those leaving the control (BL12 section 5; SOA: dog-legs). The 45° are a proposal." }

[[rules]]
id = "wkb2026.leg.acute_angle_hint"
key = "acute_angle"
severity = "hint"
values = { degrees = 90.0 }
source = { doc = "BL12", section = "5. Bahnkonzeption" }

[[rules]]
id = "wkb2026.leg.straight_angle_hint"
key = "straight_angle"
severity = "hint"
values = { degrees = 170.0 }
source = { doc = "claude", section = "number placement plan, Task 3" }
note = { de = "Läuft die Bahn am Posten fast geradeaus weiter, ändert der Posten die Laufrichtung kaum, und hinter dem Kreis ist kein Platz für die Nummer. Die 170° hat der Nutzer festgelegt.", en = "When the course runs almost straight on at a control, the control hardly changes the running direction, and there is no room for the number behind the circle. The user set the 170°." }

[[rules]]
id = "wkb2026.number.gap"
key = "number_gap"
severity = "warning"
values = { min_gap_mm = 0.5, max_gap_mm = 5.0 }
source = { doc = "claude", section = "number gap plan, Task 1" }
note = { de = "ISOM/ISSprOM Symbol 704 und WKB B 7.2.6 verlangen nur, dass die Nummer nah am Kreis steht und eindeutig zu ihm gehört, ohne einen Wert zu nennen. Die Nummer braucht Weißraum zur Kreislinie. 0,5 und 5 mm hat der Nutzer festgelegt.", en = "ISOM/ISSprOM symbol 704 and WKB B 7.2.6 only ask that the number sits close to the circle and clearly belongs to it, without giving a value. The number needs white space to the circle line. The user set 0.5 and 5 mm." }

[[rules]]
id = "wkb2026.leg.opposing"
key = "opposing_legs"
severity = "warning"
values = { metres = 10.0, min_length_metres = 30.0, min_angle_degrees = 135.0 }
source = { doc = "claude", section = "M2b plan, Task 5" }
note = { de = "WKB B 7.2.6: längere gegenläufige Teilstrecken vermeiden. Die WKB nennen keine Zahlen; 10 m Abstand, 30 m Länge und 135° sind Vorschläge.", en = "WKB B 7.2.6: avoid longer stretches run in opposite directions. The WKB give no numbers; 10 m apart, 30 m long and 135° are proposals." }

# ---------------------------------------------------------------------------------------------
# Control codes (plan M2b, Task 6)

[[rules]]
id = "wkb2026.code.range"
key = "code_range"
severity = "error"
# Codes greater than 30 and less than 600. A code that is no number gets non_numeric_severity.
values = { range = [31, 599], non_numeric_severity = "warning" }
source = { doc = "WKB26", section = "B 7.2.10" }

[[rules]]
id = "wkb2026.code.pairs"
key = "code_pairs"
severity = "error"
values = { pairs = [[66, 99], [68, 89], [86, 98]] }
source = { doc = "WKB26", section = "B 7.2.10" }

[[rules]]
id = "wkb2026.code.confusable_next"
key = "code_confusable_next"
severity = "warning"
source = { doc = "IOF-SG", section = "Finalising the course design" }
note = { de = "Codes, die auf dem Kopf gleich aussehen oder sich nur durch 6 und 9 unterscheiden, verwechseln Läufer leicht (auch SOA, BOF 21.3).", en = "Runners easily mix up codes that look alike upside down or differ only by 6 and 9 (also SOA, BOF 21.3)." }

[[rules]]
id = "wkb2026.code.same_objects_in_circle"
key = "same_objects_in_circle"
severity = "warning"
# The control feature is the map feature nearest to the control centre within this distance
# (plan M2b, Task 4).
values = { feature_search_mm = 1.0 }
source = { doc = "TD11", section = "Beispiele aus Bundesveranstaltungen 2010 (pp. 1-3)" }
note = { de = "Mehrere gleiche Objekte im Postenkreis brauchen eine Angabe in Spalte C der Postenbeschreibung.", en = "Several identical features in the control circle need an entry in column C of the control descriptions." }

# ---------------------------------------------------------------------------------------------
# Start (plan M2b, Task 7)

[[rules]]
id = "wkb2026.start.capacity"
key = "start_capacity"
severity = "warning"
source = { doc = "SOFT", section = "7.4.4" }
note = { de = "Bahnen, die in derselben Minute starten, brauchen verschiedene erste Posten (Kriterium des Nutzers, 2026-11-08; SOFT 7.4.4).", en = "Courses starting in the same minute need different first controls (user's criterion, 2026-11-08; SOFT 7.4.4)." }

[[rules]]
id = "wkb2026.start.first_leg_angle"
key = "first_leg_angle"
severity = "hint"
values = { degrees = 30.0 }
source = { doc = "claude", section = "M2b plan, Task 7" }
note = { de = "SOFT 7.4.4 verlangt verschiedene erste Posten; die Regel prüft zusätzlich die Richtung. Die 30° sind ein Vorschlag.", en = "SOFT 7.4.4 asks for different first controls; this rule also looks at the direction. The 30° are a proposal." }

