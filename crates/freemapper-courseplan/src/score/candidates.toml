# Candidate control sites (ADR 0062), keyed by ISSprOM symbol code. A code matches itself and its sub-codes
# (521 matches 521.3, not 5213).
#
# kind = "point"   a point symbol is a site at its position
# kind = "corner"  the corner vertices of a line or area outline (turn of at least 45 degrees) are sites
# clarity          how clearly a runner recognises the feature, 0.0 to 1.0; feature unclarity is 1 - clarity
#
# freemapper-core has no object class for "clear control site", so the list is ours. ISSprOM has no bench
# symbol; benches and the like show up as 530 or 531 (prominent man-made feature).

[[class]]
kind = "point"
clarity = 0.9
codes = ["311", "526", "524", "525", "522.1", "530", "531"]

[[class]]
kind = "point"
clarity = 0.8
codes = ["204", "205", "206", "312", "417", "527"]

[[class]]
kind = "point"
clarity = 0.6
codes = ["109", "110", "111", "112", "203", "207", "418", "419"]

[[class]]
kind = "corner"
clarity = 0.9
codes = ["521", "522.3", "522.4"]

[[class]]
kind = "corner"
clarity = 0.8
codes = ["515", "518", "513", "516", "532", "501.1"]
