# Shared number placement cases for freemapper-core and freemapper-courseplan.
#
# Source: freemapper-core (this repository), crates/freemapper-course/tests/fixtures/placement/cases.toml,
#   commit: see `git log` of this file. Written for the move of courseplan's `auto_place` into core's
#   `placement::place_course_numbers`. freemapper-courseplan copies this file unchanged and runs it through its
#   old code; both repositories read it with `placement_cases_match_expected`.
# Date: 2026-11-10
# Licence: GPL-3.0-or-later (same as the repository)
#
# FORMAT (format = 1). Coordinates are map mm, y points down. Angles are degrees, 0 = east, counter-clockwise
# on the page (so "north" is -y).
#
# [[case]]
#   name        unique string
#   map_kind    "sprint" | "forest"        sprint: circle 6.0, line 0.35, number height 4.0, base scale 4000
#                                          forest: circle 5.0, line 0.35, number height 4.0, base scale 15000
#   map_scale   u32                        factor = base scale / map_scale
#   start       [x, y]                     the start; no stop, no circle, no number
#   finish      [x, y]                     the finish; likewise
#   start_bends [[x, y], ...]              optional: bends of the leg that leaves the start
#   gap_min, gap_max                       optional floats: the rule limits before rounding, in print mm, as the
#                                          arguments of GapRange::from_limits
#   stops       array of tables, in running order, between start and finish
#   map_points  [[x, y], ...]              zero-length map segments, half width 0.5 (no scaling by factor)
#   map_lines   [[[x, y], ...], ...]       map polylines, half width 0.15 (no scaling by factor)
#   expected    array, one entry per stop: { direction = f, gap = f } or "none"   (the ruled values, ADR 0016)
#
# Lengths derived from the kind, all multiplied by factor: circle radius = diameter / 2, half line width =
# line / 2, number box = (0.6 * height * digits, height), gaps (unit = factor). Map points and lines are
# not scaled. The map elements are Tier::MapSymbol, one label per feature, never named c<n>, l<n> or n<n>.
#
# A stop is { at = [x, y], crossing = true | absent, kept = { direction, gap } | absent,
#             bends = [[x, y], ...] | absent, repeat = n | absent, step = [dx, dy] | absent }.
#   * Numbers are NOT given. courseplan numbers controls 1, 2, 3, ... in running order and gives crossing
#     points no number (control_numbers), so the number of a stop is its place among the non-crossing stops;
#     a number of 10 or more is two digits, of 100 or more three.
#   * bends: courseplan's convention. The bends sit on the stop the leg LEAVES (CourseControl.bends); the leg
#     start -> first stop has start_bends, the leg last stop -> finish has the bends of the last stop. The
#     polyline of leg k is [from, bends..., to], with from = start or stop k-1 and to = stop k or the finish.
#     A bend before the first stop is thus start_bends, a bend before the finish the last stop's bends.
#   * repeat = n, step = [dx, dy] expands the entry into n stops at at, at + step, at + 2 step, ... The copies
#     share crossing; kept and bends are not allowed together with repeat > 1. This builds courses with 10 or
#     100 numbered controls.
#   * kept belongs to numbered stops only (a crossing point has no number to keep).
#   * A control visited twice is two stops with the same `at`.
#
# `expected` and the dump (PLACEMENT_CASES_DUMP) have ONE entry per stop AFTER expansion, crossing points
# included. A crossing point's entry is "none". courseplan's auto_place returns entries for numbered controls
# only, so its harness (Task 3) inserts "none" at every crossing stop to get the same shape, and compares
# direction and gap per entry. The dump is `[[result]]` tables in case order with `name` and `placements`
# (array of { direction, gap } or "none").
#
format = 1


