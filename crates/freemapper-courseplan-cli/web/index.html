<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="editor-page-title"></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <main class="panes">
    <nav class="pane" id="pane-tree" data-label="editor-pane-tree"></nav>
    <section class="pane" id="pane-map" data-label="editor-pane-map">
      <div class="toolbar" role="toolbar" data-label="editor-toolbar-label">
        <button type="button" id="tool-select" data-text="editor-tool-select" aria-pressed="true"></button>
        <button type="button" id="tool-control" data-text="editor-tool-control" aria-pressed="false"></button>
        <button type="button" id="tool-crossing" data-text="editor-tool-crossing" aria-pressed="false"></button>
        <button type="button" id="tool-special" data-text="editor-tool-special" aria-pressed="false"></button>
        <span class="special-options" id="special-options" hidden>
          <label for="special-kind" data-text="editor-special-kind"></label>
          <select id="special-kind"></select>
          <label for="special-id" data-text="editor-special-id"></label>
          <input id="special-id" type="text" autocomplete="off" size="16">
        </span>
        <button type="button" id="tool-course" data-text="editor-tool-course" aria-pressed="false"></button>
        <button type="button" id="preview-btn" data-text="editor-tool-preview" data-title="editor-tool-preview-hint" aria-pressed="false" disabled></button>
        <span class="spacer"></span>
        <button type="button" id="undo-btn" data-text="editor-tool-undo" disabled></button>
        <button type="button" id="redo-btn" data-text="editor-tool-redo" disabled></button>
        <button type="button" id="help-btn" data-label="editor-tool-help" data-title="editor-tool-help">?</button>
        <button type="button" id="zoom-out" data-label="editor-zoom-out" data-title="editor-zoom-out">&minus;</button>
        <button type="button" id="zoom-in" data-label="editor-zoom-in" data-title="editor-zoom-in">+</button>
        <button type="button" id="zoom-fit" data-label="editor-zoom-fit" data-title="editor-zoom-fit">0</button>
      </div>
      <div id="banner" role="alert"></div>
      <svg id="map-svg" tabindex="0" role="application" data-label="editor-pane-map" xmlns="http://www.w3.org/2000/svg">
        <g id="layer-map"></g>
        <g id="layer-overlay"></g>
        <g id="layer-findings" aria-hidden="true"></g>
      </svg>
    </section>
    <aside class="pane" id="pane-props" tabindex="0" data-label="editor-pane-props">
      <h2 data-text="editor-props-heading"></h2>
      <div id="props"></div>
      <h2 id="findings-heading" data-text="editor-findings-heading"></h2>
      <div id="findings" tabindex="-1" aria-labelledby="findings-heading"></div>
    </aside>
  </main>
  <header class="menubar">
    <details class="menu">
      <summary data-text="editor-menu-event"></summary>
      <ul>
        <li><button type="button" id="menu-export-xml" data-text="editor-menu-export-xml"></button></li>
        <li><button type="button" id="menu-export-ppen" data-text="editor-menu-export-ppen"></button></li>
        <li><button type="button" id="menu-import" data-text="editor-menu-import"></button></li>
        <li><button type="button" id="menu-sync" data-text="editor-menu-sync"></button></li>
        <li><button type="button" id="menu-close" data-text="editor-menu-close"></button></li>
      </ul>
    </details>
  </header>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title" data-text="editor-help-title"></h2>
    <table id="help-keys"></table>
    <form method="dialog"><button type="submit" data-text="editor-help-close" autofocus></button></form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title" data-text="editor-confirm-title"></h2>
    <p data-text="editor-confirm-used"></p>
    <ul id="confirm-courses"></ul>
    <div class="dialog-buttons">
      <button type="button" id="confirm-yes" data-text="editor-confirm-delete"></button>
      <button type="button" id="confirm-no" data-text="editor-cancel" autofocus></button>
    </div>
  </dialog>
  <dialog id="name-dialog" aria-labelledby="name-title">
    <form id="name-form" method="dialog">
      <h2 id="name-title"></h2>
      <p><label for="name-input" id="name-label"></label></p>
      <p><input id="name-input" type="text" autocomplete="off"></p>
      <p class="field-error" id="name-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="submit" id="name-ok" data-text="editor-create"></button>
        <button type="button" id="name-cancel" data-text="editor-cancel"></button>
      </div>
    </form>
  </dialog>
  <dialog id="accept-dialog" aria-labelledby="accept-title">
    <form id="accept-form" method="dialog">
      <h2 id="accept-title" data-text="editor-accept-title"></h2>
      <p id="accept-finding"></p>
      <p><label for="accept-input" data-text="editor-accept-label"></label></p>
      <p><input id="accept-input" type="text" autocomplete="off"></p>
      <p class="field-error" id="accept-error" role="alert" data-text="editor-error-accept-note" hidden></p>
      <div class="dialog-buttons">
        <button type="submit" id="accept-ok" data-text="editor-accept-ok"></button>
        <button type="button" id="accept-cancel" data-text="editor-cancel"></button>
      </div>
    </form>
  </dialog>
  <dialog id="export-dialog" aria-labelledby="export-title">
    <h2 id="export-title" data-text="editor-export-ppen-title"></h2>
    <p data-text="editor-export-ppen-intro"></p>
    <p><strong data-text="editor-export-ppen-linked"></strong>: <span id="export-linked-file"></span></p>
    <p class="field-error" id="export-no-link" data-text="editor-export-no-link" hidden></p>
    <p id="export-linked-note" data-text="editor-export-ppen-linked-note"></p>
    <p data-text="editor-export-ppen-download-note"></p>
    <p class="field-error" id="export-error" role="alert" hidden></p>
    <div class="dialog-buttons">
      <button type="button" id="export-linked" data-text="editor-export-ppen-to-linked"></button>
      <button type="button" id="export-download" data-text="editor-export-ppen-download"></button>
      <button type="button" id="export-cancel" data-text="editor-cancel" autofocus></button>
    </div>
  </dialog>
  <dialog id="import-dialog" aria-labelledby="import-title">
    <form id="import-form" method="dialog">
      <h2 id="import-title" data-text="editor-import-title"></h2>
      <p><label for="import-file" data-text="editor-import-file"></label></p>
      <p><input id="import-file" type="file" accept=".ppen"></p>
      <p><label class="check"><input id="import-replace" type="checkbox"> <span data-text="editor-import-replace"></span></label></p>
      <p id="import-replace-warning" data-text="editor-import-replace-warning" hidden></p>
      <p id="import-has-content" data-text="editor-import-has-content" hidden></p>
      <p class="field-error" id="import-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="submit" id="import-ok" data-text="editor-import-ok"></button>
        <button type="button" id="import-cancel" data-text="editor-cancel"></button>
      </div>
    </form>
  </dialog>
  <dialog id="sync-warn-dialog" aria-labelledby="sync-warn-title">
    <h2 id="sync-warn-title" data-text="editor-sync-warn-title"></h2>
    <p data-text="editor-sync-warn-text"></p>
    <p><label class="check"><input id="sync-warn-hide" type="checkbox"> <span data-text="editor-sync-warn-hide"></span></label></p>
    <div class="dialog-buttons">
      <button type="button" id="sync-warn-continue" data-text="editor-sync-warn-continue" autofocus></button>
      <button type="button" id="sync-warn-cancel" data-text="editor-cancel"></button>
    </div>
  </dialog>
  <dialog id="sync-dialog" aria-labelledby="sync-title">
    <h2 id="sync-title" data-text="editor-sync-title"></h2>
    <p><strong data-text="editor-sync-linked"></strong>: <span id="sync-file"></span></p>
    <p id="sync-status" role="status"></p>
    <p class="field-error" id="sync-error" role="alert" hidden></p>
    <div id="sync-body" hidden>
      <h3 id="sync-changes-heading" data-text="editor-sync-changes"></h3>
      <ul id="sync-changes"></ul>
      <h3 id="sync-conflicts-heading"><span data-text="editor-sync-conflicts"></span> (<span id="sync-conflict-count"></span> <span data-text="editor-sync-conflicts-open"></span>)</h3>
      <div id="sync-conflicts"></div>
      <p id="sync-all" class="sync-all"><button type="button" id="sync-all-ours" data-text="editor-sync-all-ours"></button> <button type="button" id="sync-all-theirs" data-text="editor-sync-all-theirs"></button></p>
      <p id="sync-all-note" data-text="editor-sync-all-note"></p>
      <p id="sync-resolve-first" data-text="editor-sync-resolve-first"></p>
      <p id="sync-first-note" data-text="editor-sync-first-note" hidden></p>
      <p id="sync-history-note" data-text="editor-sync-history-note"></p>
      <ul id="sync-stale"></ul>
      <ul id="sync-result"></ul>
      <h3 id="sync-notes-heading" data-text="editor-sync-notes"></h3>
      <ul id="sync-notes"></ul>
    </div>
    <div class="dialog-buttons">
      <button type="button" id="sync-run" data-text="editor-sync-run" disabled></button>
      <button type="button" id="sync-close" data-text="editor-sync-close" autofocus></button>
    </div>
  </dialog>
  <dialog id="report-dialog" aria-labelledby="report-title">
    <h2 id="report-title"></h2>
    <dl id="report-rows"></dl>
    <ul id="report-lines"></ul>
    <h3 id="report-notes-heading" data-text="editor-report-notes"></h3>
    <ul id="report-notes"></ul>
    <p id="report-no-notes" data-text="editor-report-no-notes"></p>
    <form method="dialog"><button type="submit" data-text="editor-report-close" autofocus></button></form>
  </dialog>
  <section class="drawer" id="findings-drawer" aria-labelledby="drawer-title" tabindex="-1" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title" data-text="editor-drawer-title"></h2>
      <button type="button" id="drawer-close" data-text="editor-drawer-close"></button>
    </div>
    <div id="drawer-body" tabindex="-1"></div>
  </section>
  <footer class="status" id="status">
    <span id="status-message" role="status" aria-live="polite"></span>
    <button type="button" class="field" id="status-findings" aria-expanded="false" aria-controls="findings-drawer" data-title="editor-findings-open">
      <span class="count" id="count-error"></span>
      <span class="count" id="count-warning"></span>
      <span class="count" id="count-hint"></span>
    </button>
    <span class="field"><span class="name" data-text="editor-status-map"></span> <span id="status-map"></span></span>
    <span class="field"><span class="name" data-text="editor-status-scale"></span> <span id="status-scale"></span></span>
    <span class="field"><span class="name" data-text="editor-status-kind"></span> <span id="status-kind"></span></span>
    <span class="field"><span class="name" data-text="editor-status-cursor"></span> <span id="status-cursor" class="cursor"></span></span>
  </footer>
</body>
</html>
