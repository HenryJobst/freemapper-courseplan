<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="editor-page-title"></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <main class="panes">
    <nav class="pane" id="pane-tree" data-label="editor-pane-tree"></nav>
    <section class="pane" id="pane-map" data-label="editor-pane-map">
      <div class="toolbar" role="toolbar" data-label="editor-toolbar-label">
        <button type="button" id="tool-select" data-text="editor-tool-select" aria-pressed="true"></button>
        <button type="button" id="tool-control" data-text="editor-tool-control" aria-pressed="false"></button>
        <button type="button" id="tool-crossing" data-text="editor-tool-crossing" aria-pressed="false"></button>
        <button type="button" data-text="editor-tool-special" disabled></button>
        <button type="button" data-text="editor-tool-course" disabled></button>
        <span class="spacer"></span>
        <button type="button" id="undo-btn" data-text="editor-tool-undo" disabled></button>
        <button type="button" id="redo-btn" data-text="editor-tool-redo" disabled></button>
        <button type="button" id="help-btn" data-label="editor-tool-help" data-title="editor-tool-help">?</button>
        <button type="button" id="zoom-out" data-label="editor-zoom-out" data-title="editor-zoom-out">&minus;</button>
        <button type="button" id="zoom-in" data-label="editor-zoom-in" data-title="editor-zoom-in">+</button>
        <button type="button" id="zoom-fit" data-label="editor-zoom-fit" data-title="editor-zoom-fit">0</button>
      </div>
      <div id="banner" role="alert"></div>
      <svg id="map-svg" tabindex="0" role="application" data-label="editor-pane-map" xmlns="http://www.w3.org/2000/svg">
        <g id="layer-map"></g>
        <g id="layer-overlay"></g>
      </svg>
    </section>
    <aside class="pane" id="pane-props" tabindex="0" data-label="editor-pane-props">
      <h2 data-text="editor-props-heading"></h2>
      <div id="props"></div>
      <h2 data-text="editor-findings-heading"></h2>
      <p class="hint" data-text="editor-findings-empty"></p>
    </aside>
  </main>
  <header class="menubar">
    <details class="menu">
      <summary data-text="editor-menu-event"></summary>
      <ul>
        <li><button type="button" id="menu-export" data-text="editor-menu-export" disabled></button></li>
        <li><button type="button" id="menu-import" data-text="editor-menu-import" disabled></button></li>
        <li><button type="button" id="menu-sync" data-text="editor-menu-sync" disabled></button></li>
        <li><button type="button" id="menu-close" data-text="editor-menu-close"></button></li>
      </ul>
    </details>
  </header>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title" data-text="editor-help-title"></h2>
    <table id="help-keys"></table>
    <form method="dialog"><button type="submit" data-text="editor-help-close" autofocus></button></form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title" data-text="editor-confirm-title"></h2>
    <p data-text="editor-confirm-used"></p>
    <ul id="confirm-courses"></ul>
    <div class="dialog-buttons">
      <button type="button" id="confirm-yes" data-text="editor-confirm-delete"></button>
      <button type="button" id="confirm-no" data-text="editor-cancel" autofocus></button>
    </div>
  </dialog>
  <footer class="status" id="status">
    <span id="status-message" role="status" aria-live="polite"></span>
    <span class="field"><span class="name" data-text="editor-status-map"></span> <span id="status-map"></span></span>
    <span class="field"><span class="name" data-text="editor-status-scale"></span> <span id="status-scale"></span></span>
    <span class="field"><span class="name" data-text="editor-status-kind"></span> <span id="status-kind"></span></span>
    <span class="field"><span class="name" data-text="editor-status-cursor"></span> <span id="status-cursor" class="cursor"></span></span>
  </footer>
</body>
</html>
