[package]
name = "freemapper-courseplan-cli"
description = "CLI, MCP server and course editor for freemapper-courseplan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freemapper-courseplan"
path = "src/main.rs"

[features]
# Tests only: a debug build with this feature takes FREEMAPPER_COURSEPLAN_UPDATE_TEST_BASE, counts as a
# release build and sends its update requests to that stub server (`cargo test -p
# freemapper-courseplan-cli --features test-stub`). Release builds never have it.
test-stub = []

[dependencies]
freemapper-courseplan.workspace = true
clap.workspace = true
freemapper-courseplan-model.workspace = true
dirs.workspace = true
axum.workspace = true
freemapper-course.workspace = true
freemapper-render.workspace = true
freemapper-printrules.workspace = true
freemapper-web.workspace = true
rust-embed.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
freemapper-update.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
minisign-verify.workspace = true

[lints]
workspace = true
